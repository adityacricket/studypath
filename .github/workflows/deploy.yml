name: Deploy StudyPath

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest main commit needs to deploy. Cancel stale/queued runs so
# a burst of commits cannot leave the current deployment waiting behind old runs.
concurrency:
  group: "studypath-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build StudyPath
        run: npm run build -- --base=/studypath/

      - name: Create SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Write build marker
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build.json

      - name: Verify expected build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/build.json
          test -d dist/assets
          grep -q "$GITHUB_SHA" dist/build.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e
          for attempt in {1..12}; do
            marker="$(curl -fsSL --max-time 10 "${SITE_URL}build.json" 2>/dev/null || true)"
            if echo "$marker" | grep -q "$EXPECTED_COMMIT"; then
              echo "Live site is serving commit $EXPECTED_COMMIT"
              exit 0
            fi
            echo "Waiting for Pages propagation (attempt $attempt/12)..."
            sleep 10
          done
          echo "Live site did not expose expected commit $EXPECTED_COMMIT"
          exit 1
